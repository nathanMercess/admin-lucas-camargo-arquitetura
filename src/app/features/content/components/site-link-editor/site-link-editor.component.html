<fieldset class="link-editor" [formGroup]="linkForm">
  <legend>{{ label() }}</legend>
  <div class="link-grid">
    <label>
      <span i18n>Texto do botão</span>
      <input pInputText formControlName="label" placeholder="Ex.: Explorar portfólio" i18n-placeholder />
    </label>
    <label>
      <span i18n>Para onde leva</span>
      <input pInputText formControlName="href" placeholder="Ex.: #portfolio ou https://..." i18n-placeholder />
    </label>
  </div>
  @if (linkForm.controls.href.invalid && linkForm.controls.href.touched) {
    <small i18n>Informe uma seção do site, uma página, um endereço HTTPS, e-mail ou telefone.</small>
  }

  <details class="link-advanced">
    <summary i18n>Opções avançadas</summary>
    <p i18n>Use apenas quando o texto visível não explicar bem o link ou quando ele precisar abrir outra aba.</p>
    <div class="link-grid">
      <label>
        <span i18n>Descrição para leitores de tela</span>
        <input pInputText formControlName="ariaLabel" placeholder="Opcional" i18n-placeholder />
      </label>
      <div class="field">
        <span i18n>Abrir link em</span>
        <p-select [options]="targetOptions" optionLabel="label" optionValue="value" formControlName="target"
          ariaLabel="Onde abrir o link" i18n-ariaLabel></p-select>
      </div>
    </div>
  </details>
</fieldset>
