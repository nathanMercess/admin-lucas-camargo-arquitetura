<section class="rich-text-editor">
  <header>
    <div>
      <span i18n>Editor de texto</span>
      <h4>{{ label() }}</h4>
    </div>
    <div class="rich-text-toolbar" aria-label="Formatação do texto" i18n-aria-label>
      <button type="button" (mousedown)="$event.preventDefault()" (click)="toggleEmphasis()"
        aria-label="Aplicar ou remover a cor de destaque" i18n-aria-label>
        <span class="rich-text-toolbar-swatch" aria-hidden="true"></span>
        <span i18n>Cor de destaque</span>
      </button>
    </div>
  </header>

  <div #editor class="rich-text-canvas" contenteditable="true" role="textbox" aria-multiline="true"
    [attr.aria-label]="label()" data-placeholder="Digite o texto aqui. Use Enter para criar uma nova linha."
    i18n-data-placeholder (input)="handleInput($event)"></div>

  <p i18n>Selecione uma palavra ou frase e use “Cor de destaque”. Enter cria uma nova linha.</p>
</section>
